name: PhotoMap
options:
  bundleIdPrefix: com.reizen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  PhotoMap:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "足迹相册"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "需要获取你的位置，用于给上传的照片标注拍摄地点。"
        NSCameraUsageDescription: "需要使用相机拍摄照片并上传。"
        NSPhotoLibraryUsageDescription: "需要访问相册以选择照片上传。"
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Generated/PhotoMap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.reizen.photomap
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Development
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reizen.photomap
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
